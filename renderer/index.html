<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com" />
  <title>Transcribe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet" />
  <style>
    /* ─── Design tokens ─────────────────────────────────────── */
    :root {
      --bg:              #0b0b10;
      --surface:         #111118;
      --surface-raised:  #16161f;
      --border:          #1c1c2a;
      --border-bright:   #28283c;

      --accent:          #8b5cf6;
      --accent-glow:     rgba(139, 92, 246, 0.28);
      --accent-dim:      rgba(139, 92, 246, 0.12);

      --text-primary:    #e8e8f0;
      --text-secondary:  #6b6b80;
      --text-muted:      #32323f;

      --status-idle:      #4b5563;
      --status-capturing: #22c55e;
      --status-paused:    #f59e0b;
      --status-error:     #ef4444;

      --radius-sm: 5px;
      --radius-md: 8px;
      --radius-lg: 12px;

      --font-ui:   'Inter', -apple-system, system-ui, sans-serif;
      --font-mono: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
    }

    /* ─── Reset ──────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text-primary);
      font-family: var(--font-ui);
      font-size: 13px;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      user-select: none;
    }

    #root { height: 100%; display: flex; flex-direction: column; }

    /* ─── Scrollbar ──────────────────────────────────────────── */
    ::-webkit-scrollbar          { width: 5px; }
    ::-webkit-scrollbar-track    { background: transparent; }
    ::-webkit-scrollbar-thumb    { background: var(--border-bright); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #38384e; }

    /* ─── Status dot pulse ───────────────────────────────────── */
    @keyframes pulse-ring {
      0%   { box-shadow: 0 0 0 0   var(--pulse-color, rgba(34,197,94,0.55)); }
      70%  { box-shadow: 0 0 0 7px transparent; }
      100% { box-shadow: 0 0 0 0   transparent; }
    }
    .dot-pulse { animation: pulse-ring 1.8s ease-out infinite; }

    /* ─── Waveform bars ──────────────────────────────────────── */
    @keyframes wave-a { 0%,100%{height:3px}  50%{height:20px} }
    @keyframes wave-b { 0%,100%{height:5px}  50%{height:24px} }
    @keyframes wave-c { 0%,100%{height:4px}  50%{height:15px} }
    @keyframes wave-d { 0%,100%{height:6px}  50%{height:22px} }
    @keyframes wave-e { 0%,100%{height:3px}  50%{height:17px} }

    .wave-active .wave-bar:nth-child(1)  { animation: wave-b 0.70s ease-in-out infinite 0.00s; }
    .wave-active .wave-bar:nth-child(2)  { animation: wave-a 0.85s ease-in-out infinite 0.05s; }
    .wave-active .wave-bar:nth-child(3)  { animation: wave-d 0.65s ease-in-out infinite 0.10s; }
    .wave-active .wave-bar:nth-child(4)  { animation: wave-b 0.80s ease-in-out infinite 0.15s; }
    .wave-active .wave-bar:nth-child(5)  { animation: wave-c 0.70s ease-in-out infinite 0.20s; }
    .wave-active .wave-bar:nth-child(6)  { animation: wave-e 0.90s ease-in-out infinite 0.25s; }
    .wave-active .wave-bar:nth-child(7)  { animation: wave-a 0.65s ease-in-out infinite 0.30s; }
    .wave-active .wave-bar:nth-child(8)  { animation: wave-d 0.80s ease-in-out infinite 0.35s; }
    .wave-active .wave-bar:nth-child(9)  { animation: wave-b 0.70s ease-in-out infinite 0.40s; }
    .wave-active .wave-bar:nth-child(10) { animation: wave-c 0.90s ease-in-out infinite 0.45s; }
    .wave-active .wave-bar:nth-child(11) { animation: wave-e 0.65s ease-in-out infinite 0.50s; }
    .wave-active .wave-bar:nth-child(12) { animation: wave-a 0.80s ease-in-out infinite 0.55s; }
    .wave-active .wave-bar:nth-child(13) { animation: wave-d 0.70s ease-in-out infinite 0.60s; }
    .wave-active .wave-bar:nth-child(14) { animation: wave-b 0.90s ease-in-out infinite 0.65s; }
    .wave-active .wave-bar:nth-child(15) { animation: wave-c 0.65s ease-in-out infinite 0.70s; }
    .wave-active .wave-bar:nth-child(16) { animation: wave-e 0.80s ease-in-out infinite 0.75s; }

    /* ─── Transcript line entry ──────────────────────────────── */
    @keyframes fade-up {
      from { opacity: 0; transform: translateY(7px); }
      to   { opacity: 1; transform: translateY(0);   }
    }
    .line-enter { animation: fade-up 0.28s ease-out; }

    /* ─── Blinking cursor on partial lines ───────────────────── */
    @keyframes cursor-blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0; }
    }
    .partial-cursor::after {
      content: '▌';
      font-size: 0.8em;
      color: var(--accent);
      animation: cursor-blink 1s step-end infinite;
      margin-left: 1px;
    }

    /* ─── Button interactions ────────────────────────────────── */
    .btn-action  { transition: filter 0.15s, transform 0.1s, box-shadow 0.15s; }
    .btn-action:hover:not(:disabled) { filter: brightness(1.12); }
    .btn-action:active:not(:disabled) { transform: scale(0.96); }

    .btn-ghost { transition: background 0.15s, transform 0.1s; }
    .btn-ghost:hover:not(:disabled) { background: var(--border-bright) !important; }
    .btn-ghost:active:not(:disabled) { transform: scale(0.96); }

    /* ─── Transcript lines selectable ───────────────────────── */
    .transcript-area { user-select: text; }
  </style>
</head>
<body>
  <div id="root"></div>
</body>
</html>
